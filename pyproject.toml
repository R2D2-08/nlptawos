[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps1-bert-storypoints"
version = "1.0.0"
description = "Within-project, random-split BERT token embeddings + CNN for TAWOS story point estimation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2",
    "torch>=2.1,<3", "transformers>=4.40,<5", "matplotlib>=3.7,<4",
    "PyYAML>=6,<7", "PyMySQL>=1.1,<2", "tqdm>=4.66,<5",
    "reportlab>=4,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

# reportlab is used for the automated final measured-results report.
